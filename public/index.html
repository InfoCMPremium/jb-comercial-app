<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JB Comércio Global · Área Comercial</title>
    <style>
      :root { color-scheme: light; --azul:#1a3d6d; --fundo:#f1f5f9; --texto:#1e293b; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--fundo); color:var(--texto); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
      main { width:min(100%,620px); padding:32px; background:#fff; border:1px solid #cbd5e1; border-radius:14px; box-shadow:0 12px 32px rgb(15 23 42 / 8%); }
      .brand { display:flex; gap:12px; align-items:center; }
      .badge { width:44px; height:44px; display:grid; place-items:center; border-radius:9px; background:var(--azul); color:#fff; font-weight:800; }
      h1 { margin:0; color:var(--azul); font-size:1.2rem; }
      p { line-height:1.55; }
      .status { margin-top:24px; padding:14px; border:1px solid #bae6fd; border-radius:9px; background:#f0f9ff; color:#0c4a6e; }
      small { color:#64748b; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><div class="badge">JB</div><div><h1>JB COMÉRCIO GLOBAL</h1><small>Área Comercial</small></div></div>
      <p>Ambiente de preparação da nova aplicação comercial.</p>
      <div class="status"><strong>Sem impacto nos dados atuais.</strong><br>O mapa, os registos e o histórico existentes continuam a funcionar como antes enquanto a migração é preparada.</div>
    </main>
  </body>
</html>
